<!DOCTYPE html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5bd6" />
    <title>Flow — Create task (daily)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div class="modal-head">
          <h2 id="dlg-title">New</h2>
          <a class="modal-close" href="index.html" aria-label="Close">×</a>
        </div>

        <!-- Tabs: Event / Task (active) -->
        <div class="tabs" role="tablist">
          <a class="tab" role="tab" href="create-event.html" aria-selected="false">Event</a>
          <button class="tab is-active" role="tab" aria-selected="true">Task</button>
        </div>

        <form class="modal-body">
          <div class="field">
            <label for="tk-title">Title</label>
            <input class="input" id="tk-title" type="text" placeholder="e.g. Drink water" />
          </div>

          <div class="field">
            <label for="tk-desc">Description</label>
            <textarea class="textarea" id="tk-desc" placeholder="Optional notes…"></textarea>
          </div>

          <div class="field">
            <label for="tk-cat">Category</label>
            <div class="select-wrap" style="--cat:#14b8a6">
              <span class="lead-swatch" aria-hidden="true"></span>
              <select class="select" id="tk-cat">
                <option>Wellbeing</option>
                <option>Deep Work</option>
                <option>Errands</option>
                <option>Learning</option>
                <option>Home</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>Type</label>
            <div class="radio-group">
              <label class="radio-card is-active">
                <span class="radio-dot" aria-hidden="true"></span>
                <span>
                  <span class="rc-title">Daily Task</span><br />
                  <span class="rc-sub">Repeats, no due date</span>
                </span>
                <input type="radio" name="tktype" checked class="sr-only" />
              </label>
              <a class="radio-card" href="create-task-normal.html">
                <span class="radio-dot" aria-hidden="true"></span>
                <span>
                  <span class="rc-title">Normal Task</span><br />
                  <span class="rc-sub">Has a due date</span>
                </span>
              </a>
            </div>
          </div>

          <!-- Daily selected: due date, due time and difficulty are intentionally hidden -->
        </form>

        <div class="modal-foot">
          <button class="btn btn-primary" type="submit">Create</button>
          <a class="btn btn-secondary" href="index.html">Cancel</a>
          <a class="btn btn-text" href="index.html">Save as Draft</a>
        </div>
      </div>
    </div>

    <nav class="demo-nav" aria-label="Design screens">
      <a href="index.html">Main</a>
      <a href="index-collapsed.html">Panel collapsed</a>
      <a href="create-event.html">Create event</a>
      <a class="here" href="create-task.html">Create task (daily)</a>
      <a href="create-task-normal.html">Create task (normal)</a>
      <a href="edit-event.html">Edit event</a>
      <a href="edit-task.html">Edit task</a>
      <a href="create-category.html">Category</a>
      <a href="date-picker.html">Date picker</a>
      <a href="confirm-delete.html">Delete</a>
      <a href="reminder-popup.html">Reminders</a>
    </nav>
  </body>
</html>
