<!DOCTYPE html>
<html lang="en" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5bd6" />
    <title>Flow — Create event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <!-- Dimmed backdrop + centered modal -->
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <div class="modal-head">
          <h2 id="dlg-title">New</h2>
          <a class="modal-close" href="index.html" aria-label="Close">×</a>
        </div>

        <!-- Tabs: Event (active) / Task -->
        <div class="tabs" role="tablist">
          <button class="tab is-active" role="tab" aria-selected="true">Event</button>
          <a class="tab" role="tab" href="create-task.html" aria-selected="false">Task</a>
        </div>

        <form class="modal-body">
          <div class="field">
            <label for="ev-title">Title</label>
            <input class="input" id="ev-title" type="text" placeholder="e.g. Design review" />
          </div>

          <div class="field">
            <label for="ev-desc">Description</label>
            <textarea class="textarea" id="ev-desc" placeholder="Add details, agenda, or a location…"></textarea>
          </div>

          <div class="field">
            <label for="ev-cat">Category</label>
            <div class="select-wrap" style="--cat:#3b82f6">
              <span class="lead-swatch" aria-hidden="true"></span>
              <select class="select" id="ev-cat">
                <option>Work</option>
                <option>Personal</option>
                <option>Health</option>
                <option>Social</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="ev-date">Date</label>
              <!-- Styled trigger that would open the mini calendar (date-picker.html) -->
              <a class="picker-field" id="ev-date" href="date-picker.html">
                <span>Aug 20, 2026</span>
                <span class="ico" aria-hidden="true">▤</span>
              </a>
            </div>
            <div class="field">
              <label for="ev-time">Time</label>
              <select class="select" id="ev-time">
                <option>16:00</option>
                <option>17:00</option>
                <option selected>18:00</option>
                <option>19:00</option>
                <option>20:00</option>
              </select>
            </div>
          </div>
        </form>

        <div class="modal-foot">
          <button class="btn btn-primary" type="submit">Create</button>
          <a class="btn btn-secondary" href="index.html">Cancel</a>
          <a class="btn btn-text" href="index.html">Save as Draft</a>
        </div>
      </div>
    </div>

    <!-- Demo-only navigation between static screens -->
    <nav class="demo-nav" aria-label="Design screens">
      <a href="index.html">Main</a>
      <a href="index-collapsed.html">Panel collapsed</a>
      <a class="here" href="create-event.html">Create event</a>
      <a href="create-task.html">Create task (daily)</a>
      <a href="create-task-normal.html">Create task (normal)</a>
      <a href="edit-event.html">Edit event</a>
      <a href="edit-task.html">Edit task</a>
      <a href="create-category.html">Category</a>
      <a href="date-picker.html">Date picker</a>
      <a href="confirm-delete.html">Delete</a>
      <a href="reminder-popup.html">Reminders</a>
    </nav>
  </body>
</html>
